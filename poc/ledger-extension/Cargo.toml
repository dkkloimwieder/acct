[package]
name = "ledger-extension"
version = "0.0.1"
edition = "2024"
publish = false
description = "acct-sw4i: pgrx extension prototype — shared-memory balance rollup + bgworker drain"

[lib]
name = "ledger_extension"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "pgrx_embed_ledger_extension"
path = "src/bin/pgrx_embed.rs"

[features]
default = ["pg18"]
pg18 = ["pgrx/pg18"]
pg_test = []

[dependencies]
pgrx = "=0.16.0"

[dev-dependencies]
pgrx-tests = "=0.16.0"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
