[package]
name = "ledger-direct"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "ledger-v3.2 hot path: pgrx 0.18 extension exposing ledger_submit_trx (per-method dispatch: SPIKE-B commutative CTEs for WAC, alt-C appends for FIFO/LIFO, ledger-core for STD/specific) and ledger_staging_drain (SPIKE-A staging-table committer). design-v3.2 §3/§4."

[lib]
name = "ledger_direct"
crate-type = ["cdylib", "rlib"]

[features]
default = ["pg18"]
pg18 = ["pgrx/pg18", "ledger-spi-common/pg18"]

[dependencies]
pgrx              = { workspace = true }
ledger-core       = { path = "../ledger-core" }
ledger-spi-common = { path = "../ledger-spi-common", default-features = false }
serde       = { workspace = true }
serde_json  = { workspace = true }
chrono      = { workspace = true }

[dev-dependencies]
pgrx-tests  = { workspace = true }
tokio       = { workspace = true }
sqlx        = { workspace = true }
rand        = { workspace = true }
proptest    = { workspace = true }
serde_json  = { workspace = true }
