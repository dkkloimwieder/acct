[package]
name = "queue-extension"
version = "0.0.1"
edition = "2024"
rust-version = "1.87"
publish = false
description = "acct-4d4n (queue PoC): pgrx extension scaffolding for the queue+committer costing primitive per poc/design_research/poc-validation-spec.md"

[lib]
name = "poc_ledger"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "pgrx_embed_poc_ledger"
path = "src/bin/pgrx_embed.rs"

[features]
default = ["pg18"]
pg18 = ["pgrx/pg18"]
pg_test = []

[dependencies]
pgrx = "=0.16.0"
serde_json = "1"

[dev-dependencies]
pgrx-tests = "=0.16.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
] }
rand = "0.9"
hdrhistogram = "7"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
