[package]
name = "queue-extension"
version = "0.0.1"
edition = "2024"
rust-version = "1.87"
publish = false
description = "acct-4d4n (queue PoC): pgrx extension scaffolding for the queue+committer costing primitive per poc/design_research/poc-validation-spec.md"

[lib]
name = "poc_ledger"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "pgrx_embed_poc_ledger"
path = "src/bin/pgrx_embed.rs"

[features]
default = ["pg18"]
pg18 = ["pgrx/pg18"]
pg_test = []

[dependencies]
pgrx = "=0.16.0"

[dev-dependencies]
pgrx-tests = "=0.16.0"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
