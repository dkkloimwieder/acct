[package]
name = "queue-extension-v21"
version = "0.0.1"
edition = "2024"
rust-version = "1.87"
publish = false
description = "acct-gx1z (queue v2.1 PoC): pgrx 0.18 extension scaffolding for the two-queue + router costing primitive per poc/design_research/poc-v2.1.md"

[lib]
name = "poc_v21_ledger"
crate-type = ["cdylib"]

[features]
default = ["pg18"]
pg18 = ["pgrx/pg18"]
pg_test = []
# Exposes the poc_v21_test_* pg_externs (see acct-gx1z.1.2). Required
# by every test binary in tests/; gated OUT of production .so builds
# so SQL callers cannot reach state-mutating helpers like
# poc_v21_test_force_reset_slot.
test_hooks = []

[dependencies]
pgrx = "=0.18.0"
serde_json = "1"
libc = "0.2"
uuid = { version = "1", default-features = false }

[dev-dependencies]
pgrx-tests = "=0.18.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "uuid",
] }
rand = "0.9"
hdrhistogram = "7"
proptest = "1"
uuid = { version = "1", features = ["v4", "v5"] }
sha2 = "0.10"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
