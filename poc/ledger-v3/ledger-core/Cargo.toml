[package]
name = "ledger-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Pure-Rust cost-ledger transformation core for ledger-v3. plan_apply(snapshot, lines) over FIFO/LIFO/WAC/STD/specific-id methods. No pgrx; no DB."

[lib]
name = "ledger_core"

[dependencies]
serde      = { workspace = true }
chrono     = { workspace = true }
uuid       = { workspace = true, features = ["v4"] }
thiserror  = { workspace = true }

[dev-dependencies]
proptest   = { workspace = true }
