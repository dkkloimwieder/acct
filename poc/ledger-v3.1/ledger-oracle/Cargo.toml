# ledger-oracle — independent sequential reference model (acct-0at4.4).
#
# A pure-Rust reimplementation of design-v3.1 §3 costing/quantity semantics, kept
# deliberately INDEPENDENT of ledger-core's arithmetic: the running average is
# carried as an exact `BigRational` and rounded half-to-even from scratch (never
# via ledger-core's `banker_div`), so a bug shared by BOTH the direct and routed
# flavors — which both call ledger-core — is catchable here (§9.4 differential
# oracles cannot catch a shared bug). No pgrx, no DB: this crate is the model; the
# exact-mode / envelope-mode differentials live in the ledger-direct-c /
# ledger-routed-c test binaries that dev-depend on it.
#
# It reuses ledger-core's *input/output data types* (LineType, PoolMethod,
# ProvisionalBasis, TrxLineRequest) — those are plain data classifications, not
# the cost logic the model must re-derive.
[package]
name = "ledger-oracle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ledger-core = { path = "../ledger-core" }
num-rational = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
chrono = { workspace = true }

# Property-based differential (acct-0at4.6): drive plan_apply_provisional and the
# ModelLedger on the same proptest-generated interleavings. Pure Rust — no pgrx,
# no DB — so it runs fast and can afford deep case counts. Homed here (not in
# ledger-core) because ledger-oracle already deps ledger-core; the reverse would
# be a dependency cycle.
[dev-dependencies]
proptest = { workspace = true }
rand = { workspace = true }
