[package]
name = "ledger-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "ledger-v3.1 measurement binary: multi-session driver, synthetic workload generator, three submission modes (direct per-call / direct batched-per-caller / routed), deep-pool seeding, scenarios S1-S8, throughput / per-trx lock-hold / WAL measurement, JSON output (design-v3.1 §10)."

[[bin]]
name = "ledger-harness"
path = "src/main.rs"

[dependencies]
tokio        = { workspace = true }
sqlx         = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
clap         = { workspace = true }
rand         = { workspace = true }
rand_distr   = "0.5"
hdrhistogram = { workspace = true }
uuid         = { workspace = true, features = ["v4"] }
chrono       = { workspace = true }
humantime    = "2"
ledger-core  = { path = "../ledger-core" }
ledger-oracle = { path = "../ledger-oracle" }

[dev-dependencies]
tempfile     = "3"
