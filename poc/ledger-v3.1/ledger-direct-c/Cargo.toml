[package]
name = "ledger-direct-c"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "ledger-v3.1 Path C direct flavor: pgrx 0.18 extension exposing ledger_submit_trx_c — synchronous provisional-cost SPI inside the caller's user-tx (design-v3.1 §5)."

[lib]
name = "ledger_direct_c"
crate-type = ["cdylib", "rlib"]

[features]
default = ["pg18"]
pg18 = ["pgrx/pg18", "ledger-spi-common/pg18"]
pg_test = []
# Exposes test-only pg_externs; gated OUT of production .so builds so SQL callers
# cannot reach state-mutating helpers. Mirrors ledger-v3's pattern.
test_hooks = []

[dependencies]
pgrx            = { workspace = true }
ledger-core     = { path = "../ledger-core" }
ledger-spi-common = { path = "../ledger-spi-common", default-features = false }
serde       = { workspace = true }
serde_json  = { workspace = true }
chrono      = { workspace = true }

[dev-dependencies]
pgrx-tests  = { workspace = true }
tokio       = { workspace = true }
sqlx        = { workspace = true }
rand        = { workspace = true }
proptest    = { workspace = true }
uuid        = { workspace = true, features = ["v4"] }
