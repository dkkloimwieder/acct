[package]
name = "ledger-routed-c"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "ledger-v3.1 Path C routed flavor: pgrx 0.18 extension with shmem staging queue + router BGWorker + committer BGWorker pool (no pristine-replay) + recovery (design-v3.1 §6)."

[lib]
name = "ledger_routed_c"
crate-type = ["cdylib", "rlib"]

[features]
default = ["pg18"]
pg18 = ["pgrx/pg18", "ledger-spi-common/pg18"]
# See ledger-direct-c/Cargo.toml; same gating pattern.
test_hooks = []
# In-process apply-path microbench entry point (acct-q6sx). Opt-in, NOT in the
# production .so: it adds a #[pg_extern] timing harness that drives plan_and_write
# directly. Build via WITH_BENCH_HOOKS=1 scripts/install-routed-c.sh.
bench_hooks = []

[dependencies]
pgrx            = { workspace = true }
ledger-core     = { path = "../ledger-core" }
ledger-spi-common = { path = "../ledger-spi-common", default-features = false }
serde       = { workspace = true }
serde_json  = { workspace = true }
chrono      = { workspace = true }
libc        = { workspace = true }
uuid        = { workspace = true, features = ["v4"] }
sha2        = { workspace = true }

[dev-dependencies]
pgrx-tests  = { workspace = true }
tokio       = { workspace = true }
sqlx        = { workspace = true }
rand        = { workspace = true }
proptest    = { workspace = true }
ledger-oracle = { path = "../ledger-oracle" }
