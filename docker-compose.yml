services:
  postgres:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: acct-postgres:18
    container_name: acct-postgres
    security_opt:
      - seccomp:unconfined
    # io_method=io_uring pre-allocates locked submission/completion queues per
    # backend; the 8 MB Docker-default RLIMIT_MEMLOCK caps backend count well
    # below max_connections=1100. Unlimited lets every backend lock its queues.
    # Production memlock hardening is tracked as acct-hbp.
    ulimits:
      memlock: -1
    environment:
      POSTGRES_DB: acct
      POSTGRES_USER: acct
      POSTGRES_PASSWORD: acct_dev
    ports:
      - "5111:5432"
    shm_size: 4gb
    volumes:
      - acct-pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acct -d acct"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  acct-pgdata:
