services:
  postgres:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: acct-postgres:18
    container_name: acct-postgres
    security_opt:
      - seccomp:unconfined
    environment:
      POSTGRES_DB: acct
      POSTGRES_USER: acct
      POSTGRES_PASSWORD: acct_dev
    ports:
      - "5111:5432"
    shm_size: 4gb
    volumes:
      - acct-pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acct -d acct"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  acct-pgdata:
