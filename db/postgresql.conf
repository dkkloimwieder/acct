# PostgreSQL 18 configuration tuned for the acct ledger workload.
#
# Hardware target: 32 GB RAM, 8 cores, SSD/NVMe.
# Source: acct-1vo7 (PG18 configuration audit + tuning for ledger workload).
#
# Override defaults at this scope and document why. Don't tune blindly.

# --- Connections & authentication --------------------------------------------
max_connections = 200                   # acct-1ia raised this from PG default 100 for T4 spec-target runs
listen_addresses = '*'

# --- Memory ------------------------------------------------------------------
shared_buffers = 8GB                    # 25% of target RAM (32GB). PG18 uses anonymous mmap; /dev/shm not impacted.
effective_cache_size = 24GB             # planner hint: 75% of target RAM. Reflects OS page cache + shared_buffers.
work_mem = 64MB                         # per-sort/hash; safe under ~30 concurrent active sessions.
maintenance_work_mem = 2GB              # VACUUM, CREATE INDEX, ALTER TABLE.
huge_pages = try                        # use 2MB pages if available; falls back to 4KB cleanly.

# --- WAL ---------------------------------------------------------------------
wal_buffers = 64MB                      # absorb burst write spikes without WALInsertLock contention.
max_wal_size = 8GB                      # reduce checkpoint frequency for write-heavy workloads.
min_wal_size = 2GB                      # avoid WAL segment recycling churn.
checkpoint_timeout = 15min              # smooth I/O over a longer window.
checkpoint_completion_target = 0.9      # spread checkpoint writes across 90% of the interval.
wal_compression = lz4                   # PG18 native LZ4; ~40-60% WAL volume reduction on small structured rows.
wal_level = replica                     # default; sufficient for streaming replicas + future logical decoding.

# --- Group commit ------------------------------------------------------------
# Small latency penalty (~20µs) on single-tx writes in exchange for fewer fsyncs
# under concurrent commit load. Beneficial for the batch API; effectively no-op
# at single-writer.
commit_delay = 20
commit_siblings = 5

# --- Storage characteristics -------------------------------------------------
random_page_cost = 1.1                  # SSD/NVMe; default 4 is HDD-tuned.
seq_page_cost = 1.0                     # default; planner baseline.
effective_io_concurrency = 256          # NVMe parallelism; default 16 is conservative.
maintenance_io_concurrency = 256        # same for VACUUM / index build prefetch.

# --- I/O method (PG18) -------------------------------------------------------
io_method = io_uring                    # requires Linux 5.13+ and seccomp:unconfined in Docker.
io_combine_limit = 16                   # default; PG18 batches I/Os up to this many 8kB blocks.

# --- JIT ---------------------------------------------------------------------
# Ledger hot path (post_posting_lines, _post_posting_lines_apply_event) plans are
# simple enough that JIT compile cost exceeds savings. Raise threshold so only
# genuinely complex queries (close hooks, recon walks) JIT.
jit = on
jit_above_cost = 500000

# --- Locks -------------------------------------------------------------------
# Batch API can touch many partitioned tables in a single txn (posting_lines,
# inventory_movements, cost_layers, lot_events, unit_events). Default 64 is tight.
max_locks_per_transaction = 128
max_pred_locks_per_transaction = 128

# --- Autovacuum --------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 6              # more concurrent vacuum across the growing table list.
autovacuum_naptime = 30s                # faster cycle than default 1min.
autovacuum_vacuum_scale_factor = 0.05   # vacuum at 5% bloat (default 20%) for hot tables.
autovacuum_analyze_scale_factor = 0.02  # analyze at 2% (default 10%).

# --- Background writer -------------------------------------------------------
bgwriter_lru_maxpages = 200             # double the default 100; spread fsync work.
bgwriter_delay = 200ms                  # default; check less aggressively.
backend_flush_after = 512kB             # backend-driven flush hint to OS; smooths fsync.

# --- Observability -----------------------------------------------------------
track_io_timing = on                    # cheap on Linux; gives EXPLAIN (BUFFERS, ANALYZE) I/O stats.
track_activities = on                   # default; pg_stat_activity wait events.
track_counts = on                       # default; pg_stat_*_tables counters.
log_min_duration_statement = 1000       # log queries >1s; tune down for perf work.
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0                      # log all temp-file usage (signals work_mem too low).

# --- Statistics --------------------------------------------------------------
default_statistics_target = 100         # default; bump to 500 if planner picks bad plans on skewed columns.

# --- Extensions --------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements,pg_cron,ledger_extension,poc_ledger,poc_v21_ledger'
cron.database_name = 'acct'

# --- poc_v21_ledger GUCs -----------------------------------------------------
# Postmaster-scope. Enables durable_queue=true at enqueue and unlocks
# committer_lazy status_insert_mode. PoC test cycle runs with this ON so
# durable-path tests don't need to flip+restart per binary. M5e.1 (acct-m8pg).
poc_v21.persistent_staging = on

# --- pg_stat_statements ------------------------------------------------------
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.track_io_timing = on
